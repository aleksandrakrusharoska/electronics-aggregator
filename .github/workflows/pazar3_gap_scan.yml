name: Pazar3 Gap-Filling Scan

# Not really a "backfill" in the usual sense of a finite job that runs
# once and finishes: pazar3.mk serves inconsistent results for the same
# listing page across requests (verified directly — same URL, different
# content seconds apart), so a full scan of the catalog doesn't
# deterministically converge to "done". Each run is closer to a
# resilient resampling pass that gradually catches more of what earlier
# runs missed due to that inconsistency (old listings included), not a
# one-time historical gap that provably empties out.

on:
  workflow_dispatch:  # trigger manually from GitHub Actions tab
  schedule:
    - cron: '0 17 * * *'  # daily at 17:00 UTC = 19:00 Macedonia time (UTC+2)

jobs:
  scan:
    runs-on: [self-hosted, windows, home-ip]
    permissions:
      issues: write
    timeout-minutes: 360  # 6-hour cap; spider naturally slows as fewer never-seen ads remain to visit

    defaults:
      run:
        working-directory: scrapy_project
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapy_project/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env

      - name: Scan pazar3 catalog for missed listings
        run: |
          scrapy crawl pazar3_oldest \
            -s DOWNLOAD_DELAY=2 \
            -s CONCURRENT_REQUESTS=1 \
            -s LOG_LEVEL=INFO

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Workflow failing: ${{ github.workflow }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --search "in:title \"$TITLE\"" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "First failure: $RUN_URL"
          fi
