name: Backfill Reklama5 (oldest first)

on:
  workflow_dispatch:  # trigger manually from GitHub Actions tab
  # Schedule disabled: reklama5.mk hard-caps browsable listing pages at ~109
  # per category (despite claiming 341-384), and the historical backfill has
  # already reached that ceiling (84/86 ads sampled at the deepest reachable
  # page were already in the database) — nothing left to gain by running
  # this on a schedule. Kept as workflow_dispatch in case the site ever lifts
  # the cap or this needs a manual re-check.
  # schedule:
  #   - cron: '30 13 * * *'  # daily at 13:30 UTC = 15:30 Macedonia time (UTC+2)

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6-hour cap; spider stops on its own when it hits known ads

    defaults:
      run:
        working-directory: scrapy_project

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapy_project/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env

      - name: Crawl reklama5 oldest-first
        run: |
          scrapy crawl reklama5_oldest \
            -s DOWNLOAD_DELAY=2 \
            -s CONCURRENT_REQUESTS=1 \
            -s LOG_LEVEL=INFO
