name: Backfill Pazar3 (oldest first)

on:
  workflow_dispatch:  # trigger manually from GitHub Actions tab
  schedule:
    - cron: '0 13 * * *'  # daily at 13:00 UTC = 15:00 Macedonia time (UTC+2)

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 360  # 6-hour cap; spider stops on its own when it hits known ads

    defaults:
      run:
        working-directory: scrapy_project

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapy_project/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env

      - name: Crawl pazar3 oldest-first
        run: |
          scrapy crawl pazar3_oldest \
            -s DOWNLOAD_DELAY=2 \
            -s CONCURRENT_REQUESTS=1 \
            -s LOG_LEVEL=INFO

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Workflow failing: ${{ github.workflow }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --search "in:title \"$TITLE\"" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "First failure: $RUN_URL"
          fi
