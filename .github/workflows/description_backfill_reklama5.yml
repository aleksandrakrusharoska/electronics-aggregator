name: Description Backfill (reklama5)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of ads to process per run'
        required: false
        default: '5000'
  schedule:
    - cron: '0 18 * * *'  # daily at 18:00 UTC = 20:00 Macedonia time (UTC+2) — spread apart from the morning date-backfill cluster

jobs:
  backfill:
    runs-on: [self-hosted, windows, home-ip]
    permissions:
      issues: write
    timeout-minutes: 340
    defaults:
      run:
        working-directory: scrapy_project
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapy_project/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env

      - name: Re-scrape descriptions
        run: |
          set -o pipefail
          scrapy crawl reklama5_description_backfill \
            -a limit=${{ github.event.inputs.limit || '5000' }} \
            -s LOG_LEVEL=INFO 2>&1 | tee scrapy_run.log
          if grep -q "Failed to load URLs (loaded" scrapy_run.log; then
            echo "::error::Database fetch failed — the spider did no real work despite Scrapy reporting a clean exit"
            exit 1
          fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Workflow failing: ${{ github.workflow }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --search "in:title \"$TITLE\"" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "First failure: $RUN_URL"
          fi
