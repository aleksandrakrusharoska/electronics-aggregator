name: Daily Incremental Scrape

on:
  schedule:
    - cron: '0 2 * * *'  # runs every day at 02:00 UTC
  workflow_dispatch:       # allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapy_project

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapy_project/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "GROQ_API_KEY_2=${{ secrets.GROQ_API_KEY_2 }}" >> .env
          echo "GROQ_API_KEY_3=${{ secrets.GROQ_API_KEY_3 }}" >> .env
          echo "GROQ_API_KEY_4=${{ secrets.GROQ_API_KEY_4 }}" >> .env
          echo "GROQ_API_KEY_5=${{ secrets.GROQ_API_KEY_5 }}" >> .env
          echo "GROQ_API_KEY_6=${{ secrets.GROQ_API_KEY_6 }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "GEMINI_API_KEY_2=${{ secrets.GEMINI_API_KEY_2 }}" >> .env

      - name: Crawl pazar3 (incremental)
        timeout-minutes: 45
        continue-on-error: true  # don't let a stuck pazar3 crawl starve reklama5/parser/dedup below
        run: |
          scrapy crawl pazar3 \
            -s INCREMENTAL=1 \
            -s DOWNLOAD_DELAY=2 \
            -s CONCURRENT_REQUESTS=2 \
            -s LOG_LEVEL=INFO

      - name: Crawl reklama5 (incremental)
        run: |
          scrapy crawl reklama5 \
            -s INCREMENTAL=1 \
            -s DOWNLOAD_DELAY=2 \
            -s CONCURRENT_REQUESTS=2 \
            -s LOG_LEVEL=INFO

      - name: Run LLM parser (new ads only)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python run_parser_agent.py --limit 200

      - name: Run dedup agent
        run: |
          python run_dedup_agent.py
          python run_dedup_agent.py --same-site
