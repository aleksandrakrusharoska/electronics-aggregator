name: Daily Incremental Scrape

on:
  schedule:
    - cron: '0 15 * * *'  # daily at 15:00 UTC = 17:00 Macedonia time (UTC+2)
  workflow_dispatch:       # allows manual trigger from GitHub UI

jobs:
  scrape:
    # reklama5 needs two things from GitHub's (US) servers: a Chrome TLS
    # fingerprint (scrapy-impersonate; Scrapy's own TLS gets 403) and a
    # Macedonian IP (elsewhere it redirects to reklama5.com, a machine-
    # translated English copy). The IP comes from PROXY_URL, a residential
    # proxy that ProxyMiddleware uses for reklama5 requests only.
    runs-on: ubuntu-latest
    permissions:
      issues: write
    defaults:
      run:
        working-directory: scrapy_project
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapy_project/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "PROXY_URL=${{ secrets.PROXY_URL }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "GROQ_API_KEY_2=${{ secrets.GROQ_API_KEY_2 }}" >> .env
          echo "GROQ_API_KEY_3=${{ secrets.GROQ_API_KEY_3 }}" >> .env
          echo "GROQ_API_KEY_4=${{ secrets.GROQ_API_KEY_4 }}" >> .env
          echo "GROQ_API_KEY_5=${{ secrets.GROQ_API_KEY_5 }}" >> .env
          echo "GROQ_API_KEY_6=${{ secrets.GROQ_API_KEY_6 }}" >> .env
          echo "GROQ_API_KEY_7=${{ secrets.GROQ_API_KEY_7 }}" >> .env
          echo "GROQ_API_KEY_8=${{ secrets.GROQ_API_KEY_8 }}" >> .env
          echo "GROQ_API_KEY_9=${{ secrets.GROQ_API_KEY_9 }}" >> .env
          echo "GROQ_API_KEY_10=${{ secrets.GROQ_API_KEY_10 }}" >> .env
          echo "GROQ_API_KEY_11=${{ secrets.GROQ_API_KEY_11 }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "GEMINI_API_KEY_2=${{ secrets.GEMINI_API_KEY_2 }}" >> .env

      - name: Crawl pazar3 (incremental)
        timeout-minutes: 45
        continue-on-error: true  # don't let a stuck pazar3 crawl starve reklama5/parser/dedup below
        run: |
          scrapy crawl pazar3 \
            -s INCREMENTAL=1 \
            -s DOWNLOAD_DELAY=2 \
            -s CONCURRENT_REQUESTS=2 \
            -s LOG_LEVEL=INFO 2>&1 | tee pazar3_run.log

      - name: Crawl reklama5 (incremental)
        run: |
          scrapy crawl reklama5 \
            -s INCREMENTAL=1 \
            -s DOWNLOAD_DELAY=2 \
            -s CONCURRENT_REQUESTS=2 \
            -s LOG_LEVEL=INFO 2>&1 | tee reklama5_run.log

      # A blocked or broken spider still exits cleanly (Scrapy only logs the
      # 403s), so the run used to stay green while a portal silently stopped
      # being scraped. Read each crawl's own stats and raise an issue.
      - name: Check crawl health
        id: health
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          problems=""
          for spider in pazar3 reklama5; do
            log="${spider}_run.log"
            if [ ! -f "$log" ]; then
              problems="${problems}- ${spider}: the crawl did not run (no log)"$'\n'
              continue
            fi
            items=$(grep -o "'item_scraped_count': [0-9]*" "$log" | grep -o '[0-9]*$' | tail -1 || true)
            blocked=$(grep -o "'downloader/response_status_count/403': [0-9]*" "$log" | grep -o '[0-9]*$' | tail -1 || true)
            items=${items:-0}
            blocked=${blocked:-0}
            echo "${spider}: ${items} new ads, ${blocked} responses with HTTP 403"
            if [ "$items" -eq 0 ] || [ "$blocked" -gt 0 ]; then
              problems="${problems}- ${spider}: ${items} new ads, ${blocked} responses with HTTP 403"$'\n'
            fi
          done
          if [ -z "$problems" ]; then
            exit 0
          fi
          echo "problems=yes" >> "$GITHUB_OUTPUT"
          TITLE="Scraper returned no ads or was blocked"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="${problems}"$'\n'"Run: ${RUN_URL}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --search "in:title \"$TITLE\"" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

      # The agents and the analytics precompute run in process_new_ads.yml,
      # which starts when this workflow completes (as after every scraper).

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Workflow failing: ${{ github.workflow }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --search "in:title \"$TITLE\"" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "First failure: $RUN_URL"
          fi

      # Last, so the run shows red instead of green when a spider came back
      # empty (process_new_ads.yml still processes whatever did get scraped).
      - name: Fail run if a spider returned nothing
        if: steps.health.outputs.problems == 'yes'
        run: |
          echo "::error::At least one spider scraped 0 ads or was blocked (see the Check crawl health step)"
          exit 1
