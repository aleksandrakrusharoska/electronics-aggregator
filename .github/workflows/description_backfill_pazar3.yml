name: Description Backfill (pazar3)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of ads to process per run'
        required: false
        default: '5000'
  schedule:
    - cron: '0 10 * * *'  # daily at 10:00 UTC = 12:00 Macedonia time (UTC+2)

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: scrapy_project

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapy_project/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env

      - name: Re-scrape descriptions
        run: |
          scrapy crawl pazar3_description_backfill \
            -a limit=${{ github.event.inputs.limit || '5000' }} \
            -s LOG_LEVEL=INFO
