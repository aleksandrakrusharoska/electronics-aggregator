name: LLM Parse Ads

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max ads to parse (0 = all pending, default: 3000)'
        required: false
        default: '3000'
      source:
        description: 'Filter by source (leave blank for both)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - pazar3
          - reklama5
  schedule:
    # Reduced from twice daily to once — daily_scrape.yml already parses new
    # ads as they come in (--limit 200/day), and actual volume runs well
    # under that cap, so this scheduled run is mainly a safety-net catch-all
    # rather than the primary parsing path. Kept in the evening, not the
    # morning, since reference_price.yml is deliberately scheduled at 20:00
    # UTC specifically to run right after this one.
    - cron: '0 19 * * *'  # 21:00 Macedonia time (UTC+2) — evening run

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 360  # 6-hour max; at 4s/ad that's ~5 400 ads

    defaults:
      run:
        working-directory: scrapy_project

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapy_project/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "GROQ_API_KEY_2=${{ secrets.GROQ_API_KEY_2 }}" >> .env
          echo "GROQ_API_KEY_3=${{ secrets.GROQ_API_KEY_3 }}" >> .env
          echo "GROQ_API_KEY_4=${{ secrets.GROQ_API_KEY_4 }}" >> .env
          echo "GROQ_API_KEY_5=${{ secrets.GROQ_API_KEY_5 }}" >> .env
          echo "GROQ_API_KEY_6=${{ secrets.GROQ_API_KEY_6 }}" >> .env
          echo "GROQ_API_KEY_7=${{ secrets.GROQ_API_KEY_7 }}" >> .env
          echo "GROQ_API_KEY_8=${{ secrets.GROQ_API_KEY_8 }}" >> .env
          echo "GROQ_API_KEY_9=${{ secrets.GROQ_API_KEY_9 }}" >> .env
          echo "GROQ_API_KEY_10=${{ secrets.GROQ_API_KEY_10 }}" >> .env
          echo "GROQ_API_KEY_11=${{ secrets.GROQ_API_KEY_11 }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "GEMINI_API_KEY_2=${{ secrets.GEMINI_API_KEY_2 }}" >> .env

      - name: Run LLM parser
        run: |
          LIMIT="${{ github.event.inputs.limit || '3000' }}"
          SOURCE="${{ github.event.inputs.source || '' }}"

          ARGS=""
          if [ "$LIMIT" != "0" ]; then
            ARGS="--limit $LIMIT"
          fi
          if [ -n "$SOURCE" ]; then
            ARGS="$ARGS --source $SOURCE"
          fi

          echo "Running: python run_parser_agent.py $ARGS"
          python run_parser_agent.py $ARGS

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Workflow failing: ${{ github.workflow }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --search "in:title \"$TITLE\"" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "First failure: $RUN_URL"
          fi
