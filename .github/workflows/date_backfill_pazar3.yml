name: Date Backfill (pazar3)

on:
  workflow_dispatch:  # trigger manually from GitHub Actions tab
    inputs:
      attempt:
        description: 'Internal retry counter — do not set manually'
        required: false
        default: '1'
      limit:
        description: 'Number of ads to process per run'
        required: false
        default: '5000'
  schedule:
    - cron: '0 15 * * *'  # daily at 15:00 UTC = 17:00 Macedonia time (UTC+2)

jobs:
  backfill:
    runs-on: [self-hosted, windows, home-ip]
    permissions:
      issues: write
      actions: write
    timeout-minutes: 340

    defaults:
      run:
        working-directory: scrapy_project
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapy_project/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env

      - name: Backfill posted_date from ad detail pages
        run: |
          set -o pipefail
          scrapy crawl pazar3_date_backfill \
            -a limit=${{ github.event.inputs.limit || '5000' }} \
            -s LOG_LEVEL=INFO 2>&1 | tee scrapy_run.log
          if grep -q "Failed to load null URLs from Supabase" scrapy_run.log; then
            echo "::error::Database fetch failed — the spider did no real work despite Scrapy reporting a clean exit"
            exit 1
          fi

      # pazar3.mk sometimes 403s the very first request while the DB side
      # works fine — evidence points at per-job IP reputation (each GH
      # Actions job gets a random ephemeral IP from a shared pool) rather
      # than a durable block, since other pazar3 workflows hitting the same
      # URL succeed. A fresh workflow_dispatch run gets a fresh IP, so retry
      # a few times before treating it as a real failure worth alerting on.
      - name: Retry on site block (fresh IP)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAX_ATTEMPTS=3
          ATTEMPT="${{ github.event.inputs.attempt || '1' }}"
          if grep -qE "Ignoring response <403 https://(www\.)?pazar3\.mk" scrapy_run.log && grep -q "Total updated: 0" scrapy_run.log; then
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              NEXT=$((ATTEMPT + 1))
              echo "Site returned 403 (attempt $ATTEMPT/$MAX_ATTEMPTS) — retrying on a fresh runner IP (attempt $NEXT)..."
              gh workflow run date_backfill_pazar3.yml --repo "${{ github.repository }}" -f attempt="$NEXT"
            else
              echo "::error::Still blocked after $MAX_ATTEMPTS attempts on different IPs — likely needs a proxy, not just a retry."
              exit 1
            fi
          fi

      # Now that the spider fetches each backlog ad's own detail page
      # directly (rather than hoping for incidental matches while paging
      # through current listings), a low update ratio would mean actual
      # per-ad failures (dead listings, parse misses) rather than the old
      # "wrong part of the site" problem — still worth flagging if it recurs.
      - name: Check backlog progress
        run: |
          FOUND=$(grep -oE "Found [0-9]+ ads with null posted_date" scrapy_run.log | grep -oE "[0-9]+" | tail -1)
          UPDATED=$(grep -oE "Total updated: [0-9]+" scrapy_run.log | grep -oE "[0-9]+" | tail -1)
          if [ -n "$FOUND" ] && [ -n "$UPDATED" ] && [ "$FOUND" -gt 0 ] && [ "$UPDATED" -gt 0 ]; then
            PCT=$((UPDATED * 100 / FOUND))
            if [ "$PCT" -lt 1 ]; then
              echo "::warning::Technically succeeded but barely touched the backlog — updated $UPDATED of $FOUND null-date ads (~${PCT}%). Worth a look if this keeps happening."
            fi
          fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Workflow failing: ${{ github.workflow }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --search "in:title \"$TITLE\"" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "First failure: $RUN_URL"
          fi
