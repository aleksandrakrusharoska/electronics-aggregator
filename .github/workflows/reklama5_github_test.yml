# One-off check: does reklama5 answer GitHub's servers now that Scrapy sends
# reklama5 requests with a Chrome TLS fingerprint (scrapy-impersonate)?
# Until 2026-09-26 every reklama5 request from ubuntu-latest got 403.
#
# Safe to run: the only secret is PROXY_URL (no database keys, no .env) and
# item pipelines are turned off, so nothing is written to any database.
# Scraped items only go to a file uploaded as an artifact. Delete this
# workflow once the question is answered.

name: Reklama5 GitHub-server test

on:
  push:
    branches: [reklama5-github-test]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PROXY_URL: ${{ secrets.PROXY_URL }}

    defaults:
      run:
        working-directory: scrapy_project

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapy_project/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs 1-3 (no proxy): plain clients get 403; with the Chrome TLS
      # fingerprint reklama5 answers, but from GitHub's US IPs it redirects
      # every URL to reklama5.com, a machine-translated English copy (titles
      # translated, prices as "30,000 MKD", no locations). So reklama5 needs
      # a Macedonian IP: PROXY_URL (GitHub secret, http://user:pass@host:port)
      # is used by ProxyMiddleware for reklama5 requests only.
      - name: Proxy exit country
        run: |
          python - <<'EOF'
          import os
          from curl_cffi import requests
          proxy = os.environ.get("PROXY_URL")
          if not proxy:
              raise SystemExit("PROXY_URL secret is not set")
          r = requests.get("https://ipinfo.io/json", proxies={"https": proxy}, timeout=30)
          info = r.json()
          print("exit country:", info.get("country"), "| city:", info.get("city"), "| network:", info.get("org"))
          EOF

      # Through the proxy reklama5.mk must answer 200 itself, not 302 -> .com.
      - name: reklama5.mk through the proxy (no redirect expected)
        run: |
          python - <<'EOF'
          import os
          from curl_cffi import requests
          proxy = os.environ["PROXY_URL"]
          for url in ["https://reklama5.mk/Search?cat=580&page=1",
                      "https://reklama5.mk/AdDetails?ad=5840431"]:
              r = requests.get(url, impersonate="chrome", proxies={"https": proxy},
                               allow_redirects=False, timeout=30)
              print(r.status_code, url, "->", r.headers.get("location") or "(no redirect)")
          EOF

      # The real spider: Chrome TLS client + proxy, same delay as the daily
      # run, stopped after 60 pages. ITEM_PIPELINES={} = no database access.
      - name: Scrapy crawl through the proxy (no database)
        run: |
          scrapy crawl reklama5 \
            -s ITEM_PIPELINES='{}' \
            -s CLOSESPIDER_PAGECOUNT=60 \
            -s DOWNLOAD_DELAY=2 \
            -s CONCURRENT_REQUESTS=2 \
            -s LOG_LEVEL=DEBUG \
            -o items.jl > run.log 2>&1 || true
          grep -E "Redirecting|Filtered offsite" run.log | head -10 || true

      # Pass = ads scraped, no 403, every ad from reklama5.mk (not the
      # translated .com copy), and Macedonian-format prices ("ден"/"€").
      - name: Result
        if: always()
        run: |
          echo "=== Response codes ==="
          grep -E "response_status_count|response_bytes|item_scraped_count|finish_reason" run.log || true
          python - <<'EOF'
          import json, sys
          try:
              items = [json.loads(l) for l in open("items.jl", encoding="utf-8")]
          except FileNotFoundError:
              items = []
          log = open("run.log", encoding="utf-8").read()
          mk = [x for x in items if x["ad_url"].split("/")[2].endswith("reklama5.mk")]
          mk_price = [x for x in items if any(s in (x.get("price") or "") for s in ("ден", "€", "договор"))]
          print(f"ads: {len(items)} | from reklama5.mk: {len(mk)} | Macedonian price format: {len(mk_price)}")
          for x in items[:3]:
              print("  ", x["ad_url"], "|", (x.get("title") or "")[:50], "|", " ".join((x.get("price") or "").split()))
          ok = items and len(mk) == len(items) and "response_status_count/403" not in log
          print("RESULT:", "reklama5 works from GitHub's servers through the proxy" if ok else "NOT working")
          sys.exit(0 if ok else 1)
          EOF

      - name: Upload items and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reklama5-github-test
          path: |
            scrapy_project/items.jl
            scrapy_project/run.log
