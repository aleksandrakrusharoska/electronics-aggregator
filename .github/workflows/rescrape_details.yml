name: Rescrape Missing Ad Details (pazar3)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of ads to process per run'
        required: false
        default: '4000'
  schedule:
    - cron: '0 21 * * *'  # daily at 21:00 UTC = 23:00 Macedonia time (UTC+2)
    - cron: '0 9 * * *'   # second daily run, 12h apart, in the otherwise-empty 06:00-15:00 UTC window — doubles daily throughput against the listing_type/description backlog, since per-request pacing can't be sped up (site-side, confirmed by testing higher concurrency)

jobs:
  rescrape:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 350  # GitHub-hosted jobs are capped at 6h; the 4000-ad default batch takes ~5.2h at the observed ~4.7s/ad (AutoThrottle-paced to pazar3.mk's response time), not the ~1s/ad the delay settings alone would suggest
    defaults:
      run:
        working-directory: scrapy_project
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapy_project/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env

      - name: Re-scrape detail pages
        run: |
          set -o pipefail
          scrapy crawl pazar3_rescrape \
            -a limit=${{ github.event.inputs.limit || '4000' }} \
            -s LOG_LEVEL=INFO 2>&1 | tee scrapy_run.log
          if grep -qE "Setup failed|Failed to load URLs" scrapy_run.log; then
            echo "::error::Database fetch failed — the spider did no real work despite Scrapy reporting a clean exit"
            exit 1
          fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Workflow failing: ${{ github.workflow }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --search "in:title \"$TITLE\"" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "First failure: $RUN_URL"
          fi
